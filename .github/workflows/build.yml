name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Generate Android folder
        run: flutter create --platforms=android .

      - name: Copy Firebase config
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Get Flutter SDK path
        id: flutter_path
        run: |
          FLUTTER_PATH=$(which flutter | sed 's/\/bin\/flutter//')
          echo "path=$FLUTTER_PATH" >> $GITHUB_OUTPUT

      - name: Create local.properties
        run: |
          echo "flutter.sdk=${{ steps.flutter_path.outputs.path }}" > android/local.properties

      - name: Create settings.gradle.kts
        run: |
          cat > android/settings.gradle.kts << 'EOF'
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  requireNotNull(flutterSdkPath) { "flutter.sdk not set in local.properties" }
                  flutterSdkPath
              }

              settings.extensions.extraProperties.set("flutterSdkPath", flutterSdkPath)

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("com.google.gms.google-services") version "4.4.2" apply false
          }

          include(":app")
          EOF

      - name: Create build.gradle.kts
        run: |
          cat > android/build.gradle.kts << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = file("../build")
          subprojects {
              project.buildDir = file("${rootProject.buildDir}/${project.name}")
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete::class) {
              delete(rootProject.buildDir)
          }
          EOF

      - name: Create app/build.gradle.kts
        run: |
          cat > android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
              id("com.google.gms.google-services")
          }

          android {
              namespace = "com.example.family_finance_manager"
              compileSdk = 34

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlin {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
                  }
              }

              defaultConfig {
                  applicationId = "com.example.family_finance_manager"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              implementation("androidx.multidex:multidex:2.0.1")
              implementation(platform("com.google.firebase:firebase-bom:33.9.0"))
              implementation("com.google.firebase:firebase-auth")
              implementation("androidx.biometric:biometric:1.1.0")
          }
          EOF

      - name: Create gradle-wrapper.properties
        run: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Hive adapters
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-finance-app
          path: build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0
          if-no-files-found: error
