name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Generate Android folder
        run: flutter create --platforms=android .

      - name: Copy Firebase config
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Fix Android configuration
        run: |
          # Delete all old files
          rm -f android/app/build.gradle*
          rm -f android/build.gradle*
          rm -f android/settings.gradle*

          # Create settings.gradle.kts
          cat > android/settings.gradle.kts << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }
              settings.ext.flutterSdkPath = flutterSdkPath()

              includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id("dev.flutter.flutter-gradle-plugin") version "1.0.0" apply false
          }

          include(":app")
          EOF

          # Create build.gradle.kts (root)
          cat > android/build.gradle.kts << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = File("../build")
          subprojects {
              project.buildDir = File("${rootProject.buildDir}/${project.name}")
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete::class) {
              delete(rootProject.buildDir)
          }
          EOF

          # Create app/build.gradle.kts
          cat > android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.example.family_finance_manager"
              compileSdk = 36

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlin {
                  compilerOptions {
                      jvmTarget = "1.8"
                  }
              }

              defaultConfig {
                  applicationId = "com.example.family_finance_manager"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      proguardFiles(getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro")
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              implementation("androidx.multidex:multidex:2.0.1")
              implementation(platform("com.google.firebase:firebase-bom:32.3.1"))
              implementation("com.google.firebase:firebase-auth")
              implementation("androidx.biometric:biometric:1.1.0")
          }
          EOF

      - name: Update gradle-wrapper.properties
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-finance-app
          path: build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0
          if-no-files-found: error
