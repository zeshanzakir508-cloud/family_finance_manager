name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Generate Android folder
        run: flutter create --platforms=android .

      - name: Copy Firebase config
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Overwrite app/build.gradle.kts with correct config
        run: |
          cat > android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.example.family_finance_manager"
              compileSdk = 34

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlin {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
                  }
              }

              defaultConfig {
                  applicationId = "com.example.family_finance_manager"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      proguardFiles(getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro")
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              implementation("androidx.multidex:multidex:2.0.1")
              implementation(platform("com.google.firebase:firebase-bom:32.3.1"))
              implementation("com.google.firebase:firebase-auth")
              implementation("androidx.biometric:biometric:1.1.0")
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-finance-app
          path: build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0
          if-no-files-found: error
