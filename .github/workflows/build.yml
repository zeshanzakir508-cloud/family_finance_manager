name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Generate Android folder
        run: flutter create --platforms=android .

      - name: Copy Firebase config
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Get Flutter SDK path
        id: flutter_path
        run: |
          FLUTTER_PATH=$(which flutter | sed 's/\/bin\/flutter//')
          echo "path=$FLUTTER_PATH" >> $GITHUB_OUTPUT

      - name: Create local.properties
        run: |
          echo "flutter.sdk=${{ steps.flutter_path.outputs.path }}" > android/local.properties

      - name: Create gradle-wrapper.properties
        run: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip
          EOF

      - name: Create settings.gradle.kts
        run: |
          cat > android/settings.gradle.kts << 'EOF'
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  requireNotNull(flutterSdkPath) { "flutter.sdk not set in local.properties" }
                  flutterSdkPath
              }

              settings.extensions.extraProperties.set("flutterSdkPath", flutterSdkPath)

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.11.1" apply false
              id("org.jetbrains.kotlin.android") version "2.2.20" apply false
              id("com.google.gms.google-services") version "4.4.2" apply false
          }

          include(":app")
          EOF

      - name: Create build.gradle.kts
        run: |
          cat > android/build.gradle.kts << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = file("../build")
          subprojects {
              project.buildDir = file("${rootProject.buildDir}/${project.name}")
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete::class) {
              delete(rootProject.buildDir)
          }
          EOF

      - name: Create app/build.gradle.kts
        run: |
          cat > android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
              id("com.google.gms.google-services")
          }

          android {
              namespace = "com.finfam.app"
              compileSdk = 36
              ndkVersion = "28.2.13676358"

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }

              kotlin {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                  }
              }

              defaultConfig {
                  applicationId = "com.finfam.app"
                  minSdk = 23
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
                  multiDexEnabled = true
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
                  debug {
                      signingConfig = signingConfigs.getByName("debug")
                      isMinifyEnabled = false
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              implementation("androidx.multidex:multidex:2.0.1")
              implementation(platform("com.google.firebase:firebase-bom:33.9.0"))
              implementation("com.google.firebase:firebase-auth")
              implementation("androidx.biometric:biometric:1.1.0")
              implementation("com.google.android.gms:play-services-location:21.0.1")
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
          }
          EOF

      - name: Create debug.keystore
        run: |
          keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"

      - name: Create AndroidManifest.xml
        run: |
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="com.finfam.app">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.USE_FINGERPRINT" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:label="FinFam"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@style/LaunchTheme"
                  android:supportsRtl="true"
                  android:requestLegacyExternalStorage="true"
                  android:usesCleartextTraffic="true"
                  tools:targetApi="31">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

      - name: Create MainActivity.kt
        run: |
          mkdir -p android/app/src/main/kotlin/com/finfam/app
          cat > android/app/src/main/kotlin/com/finfam/app/MainActivity.kt << 'EOF'
          package com.finfam.app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF

      - name: Create styles.xml
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          EOF

      - name: Create launch_background.xml
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/launch_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
          </layer-list>
          EOF

      - name: Create file_paths.xml
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external" path="." />
              <external-files-path name="external_files" path="." />
              <cache-path name="cache" path="." />
              <external-cache-path name="external_cache" path="." />
              <files-path name="files" path="." />
          </paths>
          EOF

      - name: Create assets directories
        run: |
          mkdir -p assets/images
          mkdir -p assets/icons
          mkdir -p assets/fonts

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Hive adapters
        run: flutter pub run build_runner build --delete-conflicting-outputs --build-filter="lib/models/**.dart"

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons:main

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finfam-app
          path: build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0
          if-no-files-found: error
