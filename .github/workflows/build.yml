name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Google Services
        run: |
          if [ -f "android/app/google-services.json" ]; then
            echo "✅ google-services.json found"
          else
            echo "❌ google-services.json not found"
            exit 1
          fi

      - name: Generate .g.dart files (Hive)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Debug APK
        run: flutter build apk --debug --split-per-abi

      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-debug
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk

      - name: Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-debug
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk

      - name: Upload APK (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-debug
          path: build/app/outputs/flutter-apk/app-x86_64-debug.apk
