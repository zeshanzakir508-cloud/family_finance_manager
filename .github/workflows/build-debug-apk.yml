name: Build Debug APK

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      # 4. Install Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Generate .g.dart files (Hive adapters)
      - name: Generate Hive Adapters
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # 6. Clean build
      - name: Clean Build
        run: flutter clean

      # 7. Get Dependencies Again
      - name: Get Dependencies Again
        run: flutter pub get

      # 8. Regenerate .g.dart files
      - name: Regenerate Build Runner Files
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # 9. Build Debug APK
      - name: Build Debug APK
        run: flutter build apk --debug

      # 10. Upload APK as Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # 11. Upload to GitHub Release (optional)
      - name: Upload APK to Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-debug.apk
          tag_name: debug-build-${{ github.run_number }}
          name: Debug Build #${{ github.run_number }}
          body: |
            ## Debug APK Build #${{ github.run_number }}
            
            📅 Build Date: ${{ github.event.repository.updated_at }}
            🏷️ Commit: ${{ github.sha }}
            
            ### Installation Instructions:
            1. Download the APK file below
            2. Install on your Android device
            3. Enable "Install from Unknown Sources" if prompted
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
