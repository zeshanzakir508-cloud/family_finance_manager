name: family_finance_manager
description: A Family Finance Manager app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core dependencies
  google_fonts: ^8.1.0  # UPDATED: Fixes the constant evaluation error
  firebase_core: ^3.12.0  # UPDATED
  firebase_auth: ^5.5.0   # UPDATED
  cloud_firestore: ^5.6.0 # UPDATED
  firebase_storage: ^13.0.0 # UPDATED
  firebase_remote_config: ^6.0.0 # UPDATED
  
  # UI dependencies
  fl_chart: ^1.2.0
  flutter_cache_manager: ^3.4.1
  
  # State management & data
  provider: ^6.1.2
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  
  # Utilities
  intl: ^0.20.3
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  permission_handler: ^12.0.3
  connectivity_plus: ^7.2.0
  share_plus: ^13.2.0
  url_launcher: ^6.3.2
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.0
  
  # Local notifications
  flutter_local_notifications: ^22.0.1
  
  # Other
  http: ^1.6.0
  equatable: ^2.1.0
  csv: ^8.0.0
  mockito: ^5.7.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  analyzer: ^14.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
