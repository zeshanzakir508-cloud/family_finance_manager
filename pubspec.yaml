name: family_finance_manager
description: A family finance management application
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  
  # State Management
  provider: ^6.1.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI Components
  fl_chart: ^0.66.0
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.8
  
  # Biometric
  local_auth: ^2.1.8
  
  # PDF & Export
  pdf: ^3.10.0
  printing: ^5.11.0
  csv: ^5.1.1
  share_plus: ^7.2.1
  
  # Network
  http: ^1.1.0
  
  # File & Path
  path_provider: ^2.1.0
  
  # Other
  intl: ^0.18.1
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  # ✅ App Icon & Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  
  # ✅ App Icon Configuration
  # To generate app icons, run:
  # flutter pub run flutter_launcher_icons:main
  flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/icons/app_icon.png"
    min_sdk_android: 21
    web:
      generate: true
      image_path: "assets/icons/app_icon.png"
      background_color: "#2563EB"
      theme_color: "#2563EB"
    windows:
      generate: true
      image_path: "assets/icons/app_icon.png"
      icon_size: 48
    macos:
      generate: true
      image_path: "assets/icons/app_icon.png"

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
