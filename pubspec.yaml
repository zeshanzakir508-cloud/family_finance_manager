name: finfam
description: Family Finance Manager - Track income, expenses, and transfers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_remote_config: ^4.3.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # State Management
  provider: ^6.1.1

  # UI Components (NO google_fonts)
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Utilities (NO device_info_plus, permission_handler, share_plus, connectivity_plus)
  intl: ^0.18.1
  image_picker: ^1.0.4
  local_auth: ^2.1.7
  url_launcher: ^6.2.1

  # Charts & PDF
  csv: ^5.1.1

  # In-App Purchase
  in_app_purchase: ^3.1.10

  # Google Ads
  google_mobile_ads: ^4.0.0

  # Other
  package_info_plus: ^5.0.1
  
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  
  http: ^1.1.0

  # App Icons
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  flutter_lints: ^3.0.1
  mockito: ^5.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1976D2"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21
