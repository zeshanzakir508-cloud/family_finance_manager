name: finfam
description: Family Finance Manager
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0

  # Firebase
  firebase_core: ^2.15.0
  firebase_auth: ^4.10.0
  firebase_remote_config: ^4.0.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4

  # State Management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.3
  connectivity_plus: ^6.1.0

  # Charts & Reports
  fl_chart: ^0.68.0

  # Biometric
  local_auth: ^2.3.0

  # In-App Purchase
  in_app_purchase: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  analyzer: ^6.4.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#1A73E8"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true
