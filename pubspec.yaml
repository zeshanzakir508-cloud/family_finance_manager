name: family_finance_manager
description: A Family Finance Manager app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  firebase_remote_config: ^4.3.17

  # UI
  fl_chart: ^0.66.2
  google_fonts: ^6.1.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10

  # State & Storage
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3
  path_provider: ^2.1.5

  # Utilities
  intl: ^0.18.1
  http: ^1.2.0
  equatable: ^2.0.8
  connectivity_plus: ^5.0.2
  device_info_plus: ^9.1.2
  package_info_plus: ^5.0.1
  permission_handler: ^11.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^7.2.2
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  csv: ^5.1.1

  # Optional (remove if not needed)
  google_mobile_ads: ^4.0.0
  in_app_purchase: ^3.0.0
  webview_flutter: ^4.7.0
  flutter_launcher_icons: ^0.13.1
  mockito: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/empty_state/
    - assets/icons/categories/
    - assets/translations/

  # Uncomment when fonts are added
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
