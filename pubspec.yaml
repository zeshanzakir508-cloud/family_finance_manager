name: family_finance_manager
description: A family finance management application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0

  # Firebase (Web Compatible Versions)
  firebase_core: ^2.15.0
  firebase_auth: ^4.10.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4

  # State Management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.0

  # Charts & Reports
  fl_chart: ^0.68.0

  # Biometric
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  analyzer: ^6.4.0

# Override web-specific dependencies to fix compatibility
dependency_overrides:
  firebase_auth_web: ^5.8.0
  firebase_core_web: ^2.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
